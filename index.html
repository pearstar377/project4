<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport">
  <title>Pinterest Grid Layout</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <span class="home">Home</span>
      <span>Explore</span>
      <span>Create</span>
    </nav>

    <div class="search">Search</div>
    <div class="profile" aria-label="Avatar placeholder"></div>
  </header>


  <main class="grid" aria-label="20 image placeholders">
      <div class="column">
        <div class="image height-300"></div>
        <div class="image height-210"></div>
        <div class="image height-350"></div>
        <div class="image height-250"></div>
        <div class="image height-220"></div>
      </div>
      <div class="column">
        <div class="image height-350"></div>
        <div class="image height-260"></div>
        <div class="image height-310"></div>
        <div class="image height-360"></div>
        <div class="image height-250"></div>
      </div>
      <div class="column">
        <div class="image height-310"></div>
        <div class="image height-260"></div>
        <div class="image height-320"></div>
        <div class="image height-210"></div>
        <div class="image height-330"></div>
      </div>
      <div class="column">
        <div class="image height-230"></div>
        <div class="image height-360"></div>
        <div class="image height-230"></div>
        <div class="image height-370"></div>
        <div class="image height-280"></div>
      </div>
  </main>
</body>
</html>
